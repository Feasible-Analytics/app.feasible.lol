<!doctype html>
<!--
  banner.html
  Source for banner-772x250.png and banner-1544x500.png, the plugin directory
  banner. Render it at 772x250, once at device scale 1 and once at 2:

    npx playwright screenshot --viewport-size=772,250 banner.html banner-772x250.png
    npx playwright screenshot --viewport-size=772,250 --device-scale-factor=2 banner.html banner-1544x500.png

  Created: 2026-11-23
  Copyright (c) 2026 Cloudmanic Labs, LLC. All rights reserved.
-->
<html lang="en">
<meta charset="utf-8" />
<title>Plugin directory banner</title>
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; src: url("../../../internal/assets/ui/fonts/archivo-latin-wght-normal.woff2") format("woff2-variations"); }
  :root { --paper: #f3f2f2; --ink: #201e1d; --flag: #ec3013; --muted: #605d5d; --rule: #9b9797; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 772px; height: 250px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "Archivo", sans-serif; position: relative; }
  .text { position: absolute; left: 40px; top: 30px; width: 470px; }
  .mark { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .mark span, .red { color: var(--flag); }
  h1 { margin-top: 22px; font-size: 46px; font-weight: 800; line-height: 0.95; letter-spacing: -0.035em; }
  .rule { position: absolute; left: 40px; width: 430px; top: 183px; height: 2px; background: var(--rule); }
  p { position: absolute; left: 40px; top: 197px; font-size: 15px; line-height: 1.3; color: var(--ink); }
  p b { font-weight: 700; }
  .logo { position: absolute; right: 0; top: 0; width: 250px; height: 250px; }
</style>
<body>
  <div class="text">
    <div class="mark">Feasible<span>.lol</span></div>
    <h1>Cookieless analytics<br /><span class="red">for WordPress.</span></h1>
  </div>
  <div class="rule"></div>
  <p><b>Served from your own domain.</b> Counts site searches and 404s.</p>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" fill="#ec3013"/>
    <path d="M18 15h29v9.5H28.5v8.2h16.4v9.5H28.5V49H18z" fill="#f3f2f2"/>
  </svg>
</body>
</html>
