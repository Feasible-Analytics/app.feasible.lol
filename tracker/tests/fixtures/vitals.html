<!--
  vitals.html
  A page carrying both scripts: the tracker, and the optional vitals collector.

  Created: 2026-08-31
  Copyright (c) 2026 Cloudmanic Labs, LLC. All rights reserved.

  The two tags are in the order a customer would write them, but the order is
  not what makes it work: the collector reports through the tracker's public
  function, and the snippet's queue stub means a call arriving before the bundle
  is replayed rather than lost.
-->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Vitals — tracker fixture</title>
		<script>
			window.__feasible = Object.assign({ track: 1 }, window.__feasible);
		</script>
		<script defer data-domain="fixture.test" data-capture-on-localhost="1" src="/js/script.js"></script>
		<script defer data-vitals data-sample="1" src="/js/vitals.js"></script>
		<style>
			body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
			#hero { height: 240px; background: #d1d5db; }
			button { font: inherit; padding: 0.4rem 0.8rem; }
		</style>
	</head>
	<body>
		<h1>Vitals fixture</h1>

		<!-- Something big enough to be the largest contentful paint. -->
		<div id="hero">A large block</div>

		<button id="interact" type="button">Interact</button>

		<script>
			// A handler that takes long enough to be a real interaction latency,
			// so the collector has an interaction to report rather than nothing.
			document.getElementById("interact").addEventListener("click", () => {
				const until = performance.now() + 80;
				while (performance.now() < until) {
					// Busy on purpose: interaction to next paint measures the
					// delay a visitor feels, and a handler that returns instantly
					// produces no delay to measure.
				}
			});
		</script>
	</body>
</html>
