<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Queue — tracker fixture</title>
		<!--
			Byte for byte the stub our snippet ships, on one line and in its own
			tag exactly as a customer pastes it. A Go test compares the two, so
			this fixture proves what a real page does rather than what a
			hand-written one could.
		-->
		<script>window.feasible=window.feasible||function(){(window.feasible.q=window.feasible.q||[]).push(arguments)};</script>
		<script>
			// Merged rather than assigned, so a test can inject its own switches
			// through addInitScript and still have this page's default apply.
			window.__feasible = Object.assign({ track: 1 }, window.__feasible);

			// The second name is not in the shipped snippet: a site adding
			// data-alias is editing the snippet already and stubs it itself.
			window.legacy =
				window.legacy ||
				function () {
					(window.legacy.q = window.legacy.q || []).push(arguments);
				};

			// Stands in for another analytics tool already on the page. It
			// records what it receives and, like the real thing, keeps its
			// configuration on the global itself — so a tracker that seizes
			// the name silently destroys it.
			window.rival = function () {
				(window.rival.seen = window.rival.seen || []).push(arguments[0]);
			};
			window.rival.config = { site: "fixture.test" };

			window.feasible("Queued Early", { props: { when: "before" } });
			window.legacy("Legacy Queued");
			window.rival("Rival Event");
		</script>
		<script
			defer
			data-domain="fixture.test"
			data-capture-on-localhost="1"
			data-alias="legacy"
			src="/js/script.js"
		></script>
	</head>
	<body>
		<h1>Queue fixture</h1>
		<button id="after" type="button">fire through the alias after load</button>
		<button id="rival-after" type="button">fire through the other tool after load</button>
		<script>
			document.getElementById("after").onclick = () => window.legacy("Legacy Later");
			document.getElementById("rival-after").onclick = () => window.rival("Rival Later");
		</script>
	</body>
</html>
