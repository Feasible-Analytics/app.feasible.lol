{{ define "layout" }}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} · feasible.lol</title>

<!-- The theme is decided before the stylesheet paints, or every load flashes
     white before it turns slate. It reads the same preference key the dashboard
     and the sign-in screens use: these are all one origin, so choosing dark
     once should hold everywhere rather than being handed back at each boundary. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("feasible.theme");
      if (saved === "dark") document.documentElement.classList.add("dark");
      else if (saved === "light") document.documentElement.classList.add("light");
    } catch (e) {
      /* A browser with storage disabled falls through to the media query. */
    }
  })();
</script>

<link rel="stylesheet" href="/billing/assets/pages.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">feasible.lol</a>
    <nav>
      <a href="/pricing{{ if .TeamID }}?team={{ .TeamID }}{{ end }}" {{ if eq .Nav "pricing" }}class="on"{{ end }}>Pricing</a>
      <a href="/billing{{ if .TeamID }}?team={{ .TeamID }}{{ end }}" {{ if eq .Nav "billing" }}class="on"{{ end }}>Billing</a>
      <a href="/docs" {{ if eq .Nav "docs" }}class="on"{{ end }}>Docs</a>
      <a href="/dashboard/">Dashboard</a>
    </nav>
  </div>
</header>

{{ template "body" . }}

<footer class="bottom">
  <div class="wrap">
    <nav>
      <a href="/pricing{{ if .TeamID }}?team={{ .TeamID }}{{ end }}">Pricing</a>
      <a href="/docs">Documentation</a>
      <a href="/legal/privacy">Privacy &amp; data policy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/legal/dpa">Data processing addendum</a>
      <a href="mailto:{{ .SalesEmail }}">Talk to us</a>
    </nav>
    <address>
      Cloudmanic Labs, LLC<br>
      901 Brutscher Street, D112<br>
      Newberg, OR 97132<br>
      United States
    </address>
  </div>
</footer>
</body>
</html>
{{ end }}
