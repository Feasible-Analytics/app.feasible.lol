{{ define "body" }}
<div class="wrap">
  <div class="hero">
    <h1>{{ .Doc.Title }}</h1>
    <p>{{ .Doc.Summary }}</p>
  </div>
  <section class="docs">
    <aside>
      <ul>
        {{ range .Index }}
        <li><a href="/docs/{{ .Slug }}" {{ if eq .Slug $.Doc.Slug }}class="on"{{ end }}>{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </aside>
    <article class="panel prose">
      {{ .Doc.Body }}
    </article>
  </section>
</div>
{{ end }}
