<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #18181b; max-width: 520px;">
  <p>Hi{{ if .Name }} {{ .Name }}{{ end }},</p>

  <p>Someone asked to reset the password on your feasible.lol account. Use this link to choose a new one:</p>

  <p><a href="{{ .Link }}" style="color: #4f46e5;">{{ .Link }}</a></p>

  <p style="color: #71717a; font-size: 13px;">
    The link works once and expires in an hour. If you did not ask for this, you can ignore
    this email — your password has not changed.
  </p>
</div>
