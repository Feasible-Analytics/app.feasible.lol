<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #18181b; max-width: 520px;">
  <p>Hi{{ if .Name }} {{ .Name }}{{ end }},</p>

  <p>Your feasible.lol account was signed in on a new device.</p>

  <p><strong>{{ .Device }}</strong><br>{{ .When }}</p>

  <p>If that was not you, sign that session out and change your password at
     <a href="{{ .BaseURL }}/settings/sessions" style="color: #4f46e5;">{{ .BaseURL }}/settings/sessions</a>.</p>
</div>
