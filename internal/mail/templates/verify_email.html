<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #201e1d; max-width: 520px;">
  <p>Hi{{ if .Name }} {{ .Name }}{{ end }},</p>

  <p>Confirm your email address to finish setting up feasible.lol.</p>

  <p style="font-size: 30px; letter-spacing: 6px; font-weight: 700; margin: 24px 0;">{{ .Code }}</p>

  <p>Or just open this link:</p>

  <p><a href="{{ .Link }}" style="color: #ae1800;">{{ .Link }}</a></p>

  <p style="color: #605d5d; font-size: 13px;">
    The code and the link both expire in 30 minutes. If you did not create an account,
    ignore this email and nothing happens.
  </p>
</div>
