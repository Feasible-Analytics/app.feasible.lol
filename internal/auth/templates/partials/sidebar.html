<aside class="w-full border-b border-slate-200 bg-white lg:h-screen lg:w-64 lg:shrink-0 lg:border-b-0 lg:border-r lg:sticky lg:top-0"
       :class="mobileNav ? 'block' : 'hidden lg:block'">
  <div class="flex h-full flex-col p-4">
    <a href="/sites" class="mb-8 hidden items-center gap-2 px-2 text-base font-semibold text-slate-900 lg:flex">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold">f</span>
      feasible.lol
    </a>

    <nav class="flex flex-col gap-1 text-sm">
      <a href="/sites"
         class="rounded-lg px-3 py-2 font-medium {{ if eq .Nav "sites" }}bg-indigo-50 text-indigo-700{{ else }}text-slate-600 hover:bg-slate-50{{ end }}">
        Sites
      </a>
      <a href="/settings"
         class="rounded-lg px-3 py-2 font-medium {{ if eq .Nav "settings" }}bg-indigo-50 text-indigo-700{{ else }}text-slate-600 hover:bg-slate-50{{ end }}">
        Settings
      </a>
    </nav>

    {{ if eq .Nav "settings" }}
      <div class="mt-2 flex flex-col gap-1 border-l border-slate-200 pl-3 text-sm">
        <a href="/settings" class="rounded-lg px-3 py-1.5 text-slate-500 hover:text-slate-900">Account</a>
        <a href="/settings/security" class="rounded-lg px-3 py-1.5 text-slate-500 hover:text-slate-900">Two-factor</a>
        <a href="/settings/sessions" class="rounded-lg px-3 py-1.5 text-slate-500 hover:text-slate-900">Devices</a>
        <a href="/settings/team" class="rounded-lg px-3 py-1.5 text-slate-500 hover:text-slate-900">Team</a>
      </div>
    {{ end }}

    <div class="mt-auto pt-6">
      {{ if .Team }}
        <p class="px-3 text-xs font-medium uppercase tracking-wide text-slate-400">Team</p>
        <p class="truncate px-3 pb-3 text-sm text-slate-700">{{ .Team.Name }}</p>
      {{ end }}

      <div class="rounded-xl bg-slate-50 p-3">
        <p class="truncate text-sm font-medium text-slate-900">{{ .User.DisplayName }}</p>
        <p class="truncate text-xs text-slate-500">{{ .User.Email }}</p>

        <form method="post" action="/logout" class="mt-3">
          <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
          <button type="submit" class="text-sm font-medium text-slate-600 hover:text-slate-900">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</aside>
