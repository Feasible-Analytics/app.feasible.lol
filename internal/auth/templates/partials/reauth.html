<!--
  reauth.html
  The code field a Google-only account fills in instead of a password.

  Created: 2026-09-02
  Copyright (c) 2026 Cloudmanic Labs, LLC. All rights reserved.

  Rendered with dict "Lang" "Mode" "ID": the mode is "totp" for an account with
  two-factor on and "email" otherwise. The email button submits the hidden
  send-confirmation form the page renders once, since a form cannot sit inside
  another form.
-->
{{ define "reauth_code" }}
<div class="flex-1 min-w-[16rem]">
  <label for="{{ .ID }}_code" class="block text-sm font-medium text-body">
    {{ if eq .Mode "totp" }}{{ t .Lang "auth.reauth.code_label" }}{{ else }}{{ t .Lang "auth.reauth.email_label" }}{{ end }}
  </label>
  <input id="{{ .ID }}_code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
         required maxlength="6" pattern="[0-9]*"
         class="mt-1 block w-full rounded-xl border border-field px-3 py-2 font-mono text-sm tracking-[0.2em]">
  {{ if ne .Mode "totp" }}
    <p class="mt-1 text-xs text-muted">
      {{ t .Lang "auth.reauth.help" }}
      <button type="submit" form="send-confirmation" class="font-semibold text-accent hover:underline">{{ t .Lang "auth.reauth.send" }}</button>
    </p>
  {{ end }}
</div>
{{ end }}
