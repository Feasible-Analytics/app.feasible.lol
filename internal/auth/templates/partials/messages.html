  role="status" and role="alert" are what make these reach a screen reader. A
  message that only exists as a coloured box is a message half the people using
  the product never receive.
-->
{{ if .Flash }}
  <div role="status" class="mb-6 rounded-xl border border-up/30 bg-up/10 px-4 py-3 text-sm text-up-ink">
    {{ .Flash }}
  </div>
{{ end }}

{{ if .Error }}
  <div role="alert" class="mb-6 rounded-xl border border-down/30 bg-down/10 px-4 py-3 text-sm text-down-ink">
    {{ .Error }}
  </div>
{{ end }}
