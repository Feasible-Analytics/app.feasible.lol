<li class="flex items-center gap-4 px-5 py-4 hover:bg-hover"
    draggable="true" data-site="{{ .Site.ID }}"
    @dragstart="startSiteDrag($event, {{ .Site.ID }})"
    @dragover.prevent
    @drop="dropSite($event, {{ .Site.ID }})">

  <span class="cursor-grab select-none text-faint" aria-hidden="true">⠿</span>

  <div class="min-w-0 flex-1">
    <div class="flex items-center gap-2">
      <a href="/sites/{{ .Site.ID }}/settings" class="truncate text-sm font-semibold text-heading hover:text-accent-ink">
        {{ .Site.Label }}
      </a>

      {{ if .Site.Pinned }}
        <span class="rounded-md bg-warn/15 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-warn-ink">Pinned</span>
      {{ end }}

      {{ if eq .Site.OnboardedAt 0 }}
        <a href="/onboarding/{{ .Site.ID }}"
           class="rounded-md bg-accent/15 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-accent-ink">
          Finish setup
        </a>
      {{ end }}
    </div>

    <p class="truncate text-xs text-muted">
      {{ .Site.Domain }}
      {{ if ne .Site.DisplayName "" }}<span class="text-faint">·</span> {{ .Site.Timezone }}{{ end }}
    </p>
  </div>

  <div class="hidden w-32 shrink-0 sm:block">
    <svg viewBox="0 0 120 28" class="h-7 w-full text-accent" preserveAspectRatio="none" aria-hidden="true">
      <polyline fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
                points="{{ sparkline .Site.Sparkline }}" />
    </svg>
    <p class="mt-0.5 text-right text-[10px] text-faint">{{ .Site.Visitors }} visits · 30d</p>
  </div>

  <form method="post" action="/sites/{{ .Site.ID }}/pin" class="shrink-0">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit"
            title="{{ if .Site.Pinned }}Unpin this site{{ else }}Pin this site to the top{{ end }}"
            class="rounded-lg px-2 py-1 text-sm {{ if .Site.Pinned }}text-warn{{ else }}text-faint hover:text-muted{{ end }}">
      ★<span class="sr-only">{{ if .Site.Pinned }}Unpin{{ else }}Pin{{ end }} {{ .Site.Label }}</span>
    </button>
  </form>

  <a href="/sites/{{ .Site.ID }}/settings" class="shrink-0 text-xs font-medium text-muted hover:text-heading">
    Settings
  </a>
</li>
