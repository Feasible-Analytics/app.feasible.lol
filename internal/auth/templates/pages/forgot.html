{{ define "content" }}
<div class="border-2 border-line bg-card p-8">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.forgot.title" }}</h1>
  <p class="mt-1 text-sm text-muted">{{ t $.Lang "auth.forgot.subtitle" }}</p>

  <form method="post" action="{{ url $.Lang "/forgot-password" }}" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="email" class="block text-sm font-medium text-body">{{ t $.Lang "auth.forgot.email" }}</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus
             class="mt-1 block w-full border-2 border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <button type="submit"
            class="w-full btn btn-primary">
      {{ t $.Lang "auth.forgot.submit" }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    <a href="{{ url $.Lang "/login" }}" class="font-medium text-accent-ink hover:text-accent-ink">{{ t $.Lang "auth.forgot.back" }}</a>
  </p>
</div>
{{ end }}
