{{ define "content" }}
<div class="rounded-2xl border border-line bg-card p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-heading">Reset your password</h1>
  <p class="mt-1 text-sm text-muted">Tell us your email address and we will send a link that works once.</p>

  <form method="post" action="/forgot-password" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="email" class="block text-sm font-medium text-body">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus
             class="mt-1 block w-full rounded-xl border border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <button type="submit"
            class="w-full rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      Send the link
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    <a href="/login" class="font-medium text-accent-ink hover:text-accent">Back to sign in</a>
  </p>
</div>
{{ end }}
