{{ define "content" }}
<div class="border-2 border-line bg-card p-8 text-center">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.deleted.title" }}</h1>
  <p class="mt-2 text-sm text-muted">
    {{ t $.Lang "auth.deleted.body" }}
  </p>

  {{ if .RegistrationEnabled }}
    <a href="{{ url $.Lang "/register" }}"
       class="mt-6 btn btn-secondary">
      {{ t $.Lang "auth.deleted.action" }}
    </a>
  {{ else }}
    <a href="{{ url $.Lang "/login" }}"
       class="mt-6 btn btn-secondary">
      {{ t $.Lang "auth.register.sign_in" }}
    </a>
  {{ end }}
</div>
{{ end }}
