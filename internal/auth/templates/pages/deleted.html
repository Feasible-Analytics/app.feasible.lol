{{ define "content" }}
<div class="rounded-2xl border border-line bg-card p-8 text-center shadow-sm">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.deleted.title" }}</h1>
  <p class="mt-2 text-sm text-muted">
    {{ t $.Lang "auth.deleted.body" }}
  </p>

  <a href="{{ url $.Lang "/register" }}"
     class="mt-6 inline-block rounded-xl border border-field px-5 py-2.5 text-sm font-semibold text-body hover:bg-hover">
    {{ t $.Lang "auth.deleted.action" }}
  </a>
</div>
{{ end }}
