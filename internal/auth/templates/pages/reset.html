{{ define "content" }}
<div class="rounded-2xl border border-line bg-card p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-heading">Choose a new password</h1>

  {{ if .Data.Invalid }}
    <p class="mt-2 text-sm text-muted">Reset links last an hour and can only be used once.</p>

    <a href="/forgot-password"
       class="mt-6 inline-block rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      Ask for a new link
    </a>
  {{ else }}
    <p class="mt-1 text-sm text-muted">
      Every device signed in to this account will be signed out.
    </p>

    <form method="post" action="/reset-password" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      <input type="hidden" name="token" value="{{ .Data.Token }}">

      <div>
        <label for="password" class="block text-sm font-medium text-body">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="{{ .Data.MinLength }}" autofocus
               class="mt-1 block w-full rounded-xl border border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
        <p class="mt-1 text-xs text-muted">At least {{ .Data.MinLength }} characters.</p>
      </div>

      <button type="submit"
              class="w-full rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
        Set the new password
      </button>
    </form>
  {{ end }}
</div>
{{ end }}
