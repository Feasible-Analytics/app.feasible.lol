{{ define "content" }}
<div class="border-2 border-line bg-card p-8">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.reset.title" }}</h1>

  {{ if .Data.Invalid }}
    <p class="mt-2 text-sm text-muted">{{ t $.Lang "auth.reset.invalid" }}</p>

    <a href="{{ url $.Lang "/forgot-password" }}"
       class="mt-6 btn btn-primary">
      {{ t $.Lang "auth.reset.ask_again" }}
    </a>
  {{ else }}
    <p class="mt-1 text-sm text-muted">
      {{ t $.Lang "auth.reset.subtitle" }}
    </p>

    <form method="post" action="{{ url $.Lang "/reset-password" }}" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      <input type="hidden" name="token" value="{{ .Data.Token }}">

      <div>
        <label for="password" class="block text-sm font-medium text-body">{{ t $.Lang "auth.reset.password" }}</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="{{ .Data.MinLength }}" autofocus
               class="mt-1 block w-full border-2 border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
        <p class="mt-1 text-xs text-muted">{{ n $.Lang "auth.reset.password_help" .Data.MinLength }}</p>
      </div>

      <button type="submit"
              class="w-full btn btn-primary">
        {{ t $.Lang "auth.reset.submit" }}
      </button>
    </form>
  {{ end }}
</div>
{{ end }}
