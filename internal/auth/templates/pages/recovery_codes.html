{{ define "content" }}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold text-heading">{{ t $.Lang "auth.recovery_codes.title" }}</h1>
  <p class="mt-2 text-sm text-muted">
    {{ t $.Lang "auth.recovery_codes.body" }}
  </p>

  <div class="mt-6 rounded-2xl border border-warn/30 bg-warn/10 p-4 text-sm text-warn-ink">
    {{ t $.Lang "auth.recovery_codes.warning" }}
  </div>

  <div class="mt-6 rounded-2xl border border-line bg-card p-6 shadow-sm">
    <ul class="grid grid-cols-1 gap-2 font-mono text-sm text-body sm:grid-cols-2">
      {{ range .Data.Codes }}
        <li class="rounded-lg bg-subtle px-3 py-2 tracking-wide">{{ . }}</li>
      {{ end }}
    </ul>
  </div>

  <div class="mt-6 flex gap-3">
    <a href="{{ url $.Lang "/settings/security" }}"
       class="rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      {{ t $.Lang "auth.recovery_codes.saved" }}
    </a>
    <button type="button" onclick="window.print()"
            class="rounded-xl border border-field px-5 py-2.5 text-sm font-semibold text-body hover:bg-hover">
      {{ t $.Lang "auth.recovery_codes.print" }}
    </button>
  </div>
</div>
{{ end }}
