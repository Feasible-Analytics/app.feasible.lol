{{ define "content" }}
<div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">That link no longer works</h1>
  <p class="mt-2 text-sm text-slate-500">
    Verification links last 30 minutes and can only be used once. Sign in and we will send you a new one.
  </p>

  <a href="/login"
     class="mt-6 inline-block rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
    Go to sign in
  </a>
</div>
{{ end }}
