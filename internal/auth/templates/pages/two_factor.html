  One field takes both an authenticator code and a recovery code. Somebody
  reaching for a recovery code has already lost their phone; making them find a
  second link first is the wrong moment to add a step.
-->
{{ define "content" }}
<div class="rounded-2xl border border-line bg-card p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-heading">Two-factor code</h1>
  <p class="mt-1 text-sm text-muted">Open your authenticator app and enter the current code.</p>

  <form method="post" action="/login/2fa" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="code" class="block text-sm font-medium text-body">Code</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" required autofocus
             class="mt-1 block w-full rounded-xl border border-field px-3 py-3 text-center font-mono text-xl tracking-[0.3em] focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
      <p class="mt-2 text-xs text-muted">Lost your phone? Type one of your recovery codes here instead.</p>
    </div>

    <button type="submit"
            class="w-full rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      Verify
    </button>
  </form>

  <p class="mt-6 text-center text-sm">
    <a href="/login" class="text-muted hover:text-body">Start over</a>
  </p>
</div>
{{ end }}
