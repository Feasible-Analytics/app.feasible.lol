  two_factor.html
  The code box after a correct password.

  Created: 2026-08-30
  Copyright (c) 2026 Cloudmanic Labs, LLC. All rights reserved.

  One field takes both an authenticator code and a recovery code. Somebody
  reaching for a recovery code has already lost their phone; making them find a
  second link first is the wrong moment to add a step.
-->
{{ define "content" }}
<div class="border-2 border-line bg-card p-8">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.two_factor.title" }}</h1>
  <p class="mt-1 text-sm text-muted">{{ t $.Lang "auth.two_factor.subtitle" }}</p>

  <form method="post" action="{{ url $.Lang "/login/2fa" }}" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="code" class="block text-sm font-medium text-body">{{ t $.Lang "auth.two_factor.code_label" }}</label>
      <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" required autofocus
             class="mt-1 block w-full border-2 border-field px-3 py-3 text-center font-mono text-xl tracking-[0.3em] focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
      <p class="mt-2 text-xs text-muted">{{ t $.Lang "auth.two_factor.recovery_help" }}</p>
    </div>

    <button type="submit"
            class="w-full btn btn-primary">
      {{ t $.Lang "auth.two_factor.submit" }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm">
    <a href="{{ url $.Lang "/login" }}" class="text-muted hover:text-body">{{ t $.Lang "auth.two_factor.start_over" }}</a>
  </p>
</div>
{{ end }}
