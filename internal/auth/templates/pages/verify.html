{{ define "content" }}
<div class="rounded-2xl border border-line bg-card p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-heading">Confirm your email</h1>
  <p class="mt-1 text-sm text-muted">
    We sent an {{ .Data.Digits }}-digit code to <strong class="text-body">{{ .User.Email }}</strong>.
    The email also has a link that signs you straight in.
  </p>

  <form method="post" action="/verify-email" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="code" class="block text-sm font-medium text-body">Verification code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             required maxlength="{{ .Data.Digits }}" pattern="[0-9]*" autofocus
             class="mt-1 block w-full rounded-xl border border-field px-3 py-3 text-center font-mono text-xl tracking-[0.4em] focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <button type="submit"
            class="w-full rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      Confirm
    </button>
  </form>

  <form method="post" action="/verify-email/resend" class="mt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit" class="text-sm font-medium text-accent-ink hover:text-accent">Send a new code</button>
  </form>

  <form method="post" action="/logout" class="mt-6 border-t border-line pt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit" class="text-xs text-faint hover:text-muted">Sign out</button>
  </form>
</div>
{{ end }}
