{{ define "content" }}
<div class="border-2 border-line bg-card p-8">
  <h1 class="text-xl font-semibold text-heading">{{ t $.Lang "auth.verify.title" }}</h1>
  <p class="mt-1 text-sm text-muted">
    {{ t $.Lang "auth.verify.sent" "digits" .Data.Digits "email" .User.Email }}
    {{ t $.Lang "auth.verify.link_too" }}
  </p>

  <form method="post" action="{{ url $.Lang "/verify-email" }}" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <input type="hidden" name="next" value="{{ .Data.Next }}">

    <div>
      <label for="code" class="block text-sm font-medium text-body">{{ t $.Lang "auth.verify.code_label" }}</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             required maxlength="{{ .Data.Digits }}" pattern="[0-9]*" autofocus
             class="mt-1 block w-full border-2 border-field px-3 py-3 text-center font-mono text-xl tracking-[0.4em] focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <button type="submit"
            class="w-full btn btn-primary">
      {{ t $.Lang "common.action.confirm" }}
    </button>
  </form>

  <form method="post" action="{{ url $.Lang "/verify-email/resend" }}" class="mt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <input type="hidden" name="next" value="{{ .Data.Next }}">
    <button type="submit" class="text-sm font-medium text-accent-ink hover:text-accent-ink">{{ t $.Lang "auth.verify.resend" }}</button>
  </form>

  <form method="post" action="{{ url $.Lang "/logout" }}" class="mt-6 border-t border-line pt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit" class="text-xs text-faint hover:text-muted">{{ t $.Lang "auth.verify.sign_out" }}</button>
  </form>
</div>
{{ end }}
