{{ define "content" }}
<div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">Confirm your email</h1>
  <p class="mt-1 text-sm text-slate-500">
    We sent an {{ .Data.Digits }}-digit code to <strong class="text-slate-700">{{ .User.Email }}</strong>.
    The email also has a link that signs you straight in.
  </p>

  <form method="post" action="/verify-email" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="code" class="block text-sm font-medium text-slate-700">Verification code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             required maxlength="{{ .Data.Digits }}" pattern="[0-9]*" autofocus
             class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-3 text-center font-mono text-xl tracking-[0.4em] focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
    </div>

    <button type="submit"
            class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
      Confirm
    </button>
  </form>

  <form method="post" action="/verify-email/resend" class="mt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Send a new code</button>
  </form>

  <form method="post" action="/logout" class="mt-6 border-t border-slate-100 pt-4 text-center">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <button type="submit" class="text-xs text-slate-400 hover:text-slate-600">Sign out</button>
  </form>
</div>
{{ end }}
