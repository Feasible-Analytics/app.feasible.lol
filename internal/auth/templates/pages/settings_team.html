{{ define "content" }}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold text-heading">Team</h1>

  <form method="post" action="/settings/team" class="mt-8 space-y-6 rounded-2xl border border-line bg-card p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="name" class="block text-sm font-medium text-body">Team name</label>
      <input id="name" name="name" type="text" value="{{ .Team.Name }}" required
             class="mt-1 block w-full rounded-xl border border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <div class="border-t border-line pt-6">
      <label class="flex items-start gap-3">
        <input type="checkbox" name="require_2fa" value="1" {{ if .Team.Require2FA }}checked{{ end }}
               class="mt-0.5 rounded border-field text-accent-ink focus:ring-accent">
        <span class="text-sm text-body">
          Require two-factor authentication
          <span class="block text-xs text-muted">
            Anybody in this team who has not set it up lands on the enrolment screen on their next
            page load, rather than being locked out. Nobody in the team can turn their own off while
            this is on.
          </span>
        </span>
      </label>
    </div>

    <div class="border-t border-line pt-6 text-sm text-muted">
      <p>Trial ends {{ date .Team.TrialEndsAt }}.</p>
      <p class="mt-1 text-xs">
        If a subscription lapses we keep accepting your traffic until {{ date .Team.AcceptTrafficUntil }}.
        Losing data you can never get back is not an acceptable consequence of a card expiring.
      </p>
    </div>

    <button type="submit"
            class="rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      Save
    </button>
  </form>
</div>
{{ end }}
