{{ define "content" }}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold text-slate-900">Team</h1>

  <form method="post" action="/settings/team" class="mt-8 space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="name" class="block text-sm font-medium text-slate-700">Team name</label>
      <input id="name" name="name" type="text" value="{{ .Team.Name }}" required
             class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
    </div>

    <div class="border-t border-slate-100 pt-6">
      <label class="flex items-start gap-3">
        <input type="checkbox" name="require_2fa" value="1" {{ if .Team.Require2FA }}checked{{ end }}
               class="mt-0.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
        <span class="text-sm text-slate-700">
          Require two-factor authentication
          <span class="block text-xs text-slate-500">
            Anybody in this team who has not set it up lands on the enrolment screen on their next
            page load, rather than being locked out. Nobody in the team can turn their own off while
            this is on.
          </span>
        </span>
      </label>
    </div>

    <div class="border-t border-slate-100 pt-6 text-sm text-slate-500">
      <p>Trial ends {{ date .Team.TrialEndsAt }}.</p>
      <p class="mt-1 text-xs">
        If a subscription lapses we keep accepting your traffic until {{ date .Team.AcceptTrafficUntil }}.
        Losing data you can never get back is not an acceptable consequence of a card expiring.
      </p>
    </div>

    <button type="submit"
            class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
      Save
    </button>
  </form>
</div>
{{ end }}
