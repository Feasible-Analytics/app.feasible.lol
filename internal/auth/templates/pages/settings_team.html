{{ define "content" }}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold text-heading">{{ t $.Lang "auth.settings_team.title" }}</h1>

  <form method="post" action="{{ url $.Lang "/settings/team" }}" class="mt-8 space-y-6 rounded-2xl border border-line bg-card p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
    <input type="hidden" name="team_id" value="{{ .Data.TeamID }}">

    <div>
      <label for="name" class="block text-sm font-medium text-body">{{ t $.Lang "auth.settings_team.name" }}</label>
      <input id="name" name="name" type="text" value="{{ .Team.Name }}" required
             class="mt-1 block w-full rounded-xl border border-field px-3 py-2 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/25">
    </div>

    <div class="border-t border-line pt-6">
      <label class="flex items-start gap-3">
        <input type="checkbox" name="require_2fa" value="1" {{ if .Team.Require2FA }}checked{{ end }}
               class="mt-0.5 rounded border-field text-accent-ink focus:ring-accent">
        <span class="text-sm text-body">
          {{ t $.Lang "auth.settings_team.require_2fa" }}
          <span class="block text-xs text-muted">
            {{ t $.Lang "auth.settings_team.require_2fa_help" }}
          </span>
        </span>
      </label>
    </div>

    <div class="border-t border-line pt-6 text-sm text-muted">
      <p>{{ t $.Lang "auth.settings_team.trial" "date" (date $.Lang .Team.TrialEndsAt) }}</p>
      <p class="mt-1 text-xs">
        {{ t $.Lang "auth.settings_team.grace" "date" (date $.Lang .Team.AcceptTrafficUntil) }}
      </p>
    </div>

    <button type="submit"
            class="rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-fill-fg hover:bg-accent-hover">
      {{ t $.Lang "common.action.save" }}
    </button>
  </form>
</div>
{{ end }}
