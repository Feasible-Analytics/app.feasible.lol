{{ define "content" }}
<div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">Create your account</h1>
  <p class="mt-1 text-sm text-slate-500">Every feature, one flat price, 30 days free. No card.</p>

  {{ if .GoogleEnabled }}
    <a href="/auth/google"
       class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
      <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.5 12.2c0-.7-.1-1.4-.2-2H12v4h6a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-2 3.1-4.9 3.1-8z"/>
        <path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.6-2.7c-1 .7-2.3 1.1-3.6 1.1-2.8 0-5.1-1.9-6-4.4H2.3v2.8A11 11 0 0 0 12 23z"/>
        <path fill="#FBBC05" d="M6 14.3a6.6 6.6 0 0 1 0-4.2V7.3H2.3a11 11 0 0 0 0 9.8z"/>
        <path fill="#EA4335" d="M12 5.4c1.6 0 3 .5 4.1 1.6l3.1-3.1A11 11 0 0 0 2.3 7.3L6 10.1c.9-2.6 3.2-4.7 6-4.7z"/>
      </svg>
      Sign up with Google
    </a>

    <div class="my-6 flex items-center gap-3 text-xs text-slate-400">
      <span class="h-px flex-1 bg-slate-200"></span>or<span class="h-px flex-1 bg-slate-200"></span>
    </div>
  {{ end }}

  <form method="post" action="/register" class="{{ if not .GoogleEnabled }}mt-6{{ end }} space-y-4">
    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

    <div>
      <label for="name" class="block text-sm font-medium text-slate-700">Name <span class="text-slate-400">(optional)</span></label>
      <input id="name" name="name" type="text" autocomplete="name" value="{{ .Data.Name }}"
             class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ .Data.Email }}"
             class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12"
             class="mt-1 block w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
      <p class="mt-1 text-xs text-slate-500">At least 12 characters. Length is the only rule — a passphrase is fine.</p>
    </div>

    <button type="submit"
            class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
      Create account
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Already have an account? <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a>
  </p>
</div>
{{ end }}
