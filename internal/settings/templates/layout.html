{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — {{.Domain}} — feasible.lol</title>
<style>
:root {
  --ink: #101418; --muted: #5c6773; --line: #e3e7ec; --bg: #f6f7f9;
  --card: #ffffff; --accent: #2f6feb; --danger: #b3261e; --warn-bg: #fff5e5;
  --warn-line: #f0c27a; --ok-bg: #e9f7ef; --ok-line: #9dd6b4; --code: #f2f4f7;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); }
header.top { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 28px; }
header.top .brand { font-weight: 650; letter-spacing: -0.01em; }
header.top .site { color: var(--muted); margin-left: 10px; }
nav.tabs { display: flex; gap: 4px; padding: 0 28px; background: var(--card);
  border-bottom: 1px solid var(--line); }
nav.tabs a { padding: 11px 14px; text-decoration: none; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 520; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 980px; margin: 26px auto 60px; padding: 0 28px; }
h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.015em; }
h2 { font-size: 15px; margin: 0 0 4px; }
p.lede { color: var(--muted); margin: 0 0 22px; max-width: 68ch; }
section.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 18px; }
section.card > p.hint { color: var(--muted); font-size: 13.5px; margin: 2px 0 14px; max-width: 72ch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 550; font-size: 12.5px;
  text-transform: uppercase; letter-spacing: 0.04em; padding: 0 10px 7px 0; }
td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  background: var(--code); padding: 1px 5px; border-radius: 4px; }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
input[type=text], input[type=file], select {
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit;
  background: #fff; min-width: 180px; }
button { border: 1px solid transparent; background: var(--accent); color: #fff;
  border-radius: 7px; padding: 7px 13px; font: inherit; font-weight: 550; cursor: pointer; }
button.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
button.link { background: none; color: var(--danger); border: none; padding: 2px 0;
  font-weight: 500; text-decoration: underline; cursor: pointer; }
.notice { border-radius: 8px; padding: 11px 13px; font-size: 13.5px; margin-bottom: 16px; }
.notice.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); }
.notice.ok { background: var(--ok-bg); border: 1px solid var(--ok-line); }
.notice.bad { background: #fdecea; border: 1px solid #f2b8b5; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--code); color: var(--muted); }
.pill.ok { background: var(--ok-bg); color: #15683c; }
.pill.bad { background: #fdecea; color: var(--danger); }
.pill.run { background: #e8f0fe; color: #17457e; }
.bar { height: 6px; background: var(--code); border-radius: 999px; overflow: hidden; width: 150px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.myip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--code); border-radius: 8px; padding: 11px 13px; margin-bottom: 12px; }
.myip .addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
ul.merge { margin: 4px 0 0; padding-left: 18px; }
ul.merge li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><span class="brand">feasible.lol</span><span class="site">{{.Domain}} · settings</span></header>
<nav class="tabs">
  <a href="/settings/{{.Domain}}/shields" {{if eq .Tab "shields"}}class="on"{{end}}>Shields</a>
  <a href="/settings/{{.Domain}}/paths" {{if eq .Tab "paths"}}class="on"{{end}}>Path cleaning</a>
  <a href="/settings/{{.Domain}}/imports" {{if eq .Tab "imports"}}class="on"{{end}}>Import &amp; export</a>
</nav>
<main>
{{if .Error}}<div class="notice bad">{{.Error}}</div>{{end}}
{{if .Message}}<div class="notice ok">{{.Message}}</div>{{end}}
{{template "body" .}}
</main>
</body>
</html>{{end}}
