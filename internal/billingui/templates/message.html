{{ define "body" }}
<div class="max-w-2xl">
	<h1 class="font-display text-3xl font-extrabold tracking-tight text-heading">{{ .Heading }}</h1>

	<div class="mt-6 border-2 border-line bg-card p-6">
		<div class="space-y-4 text-sm text-body">
			{{ range .Paragraphs }}<p>{{ . }}</p>{{ end }}
			{{ if .Extra }}{{ .Extra }}{{ end }}
		</div>

		{{ if .Links }}
		<div class="mt-6 flex flex-wrap gap-3">
			{{ range .Links }}
			<a href="{{ .URL }}" class="btn btn-secondary">{{ .Label }}</a>
			{{ end }}
		</div>
		{{ end }}
	</div>

	<div class="mt-6">{{ template "payer-links" . }}</div>
</div>
{{ end }}
