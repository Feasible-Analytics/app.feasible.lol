<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Dashboard · feasible.lol</title>

		<!--
			Served from the signed-in application, which is mounted at the root, so
			all three surfaces point at one file. A browser asks for a favicon
			whether or not anything points at one, and three copies of the same
			encoded square is how two of them end up the wrong colour.
		-->
		<link rel="icon" href="/app/assets/favicon.svg" type="image/svg+xml" />

		<!--
			The theme is decided before the first paint, in a blocking inline
			script. Deciding it in React instead means the page paints white,
			then flips to slate a frame later, and that flash is the single most
			noticeable defect a dark-mode dashboard can ship with.
		-->
		<!--
			The storage read is wrapped on its own, not together with the
			matchMedia call below it. In a third-party frame with storage
			blocked — Brave by default, and any browser with third-party cookies
			off — touching localStorage *throws* rather than returning null, and
			it throws on the property access itself. A single try around both
			would swallow the system-theme fallback with it and leave an embed
			painting the wrong theme, which is the mild version of the bug that
			blanked an incumbent's entire embedded dashboard.
		-->
		<script>
			(function () {
				var saved = null;

				try {
					saved = localStorage.getItem("feasible.theme");
				} catch (e) {
					/* Storage is unavailable; fall through to the system theme. */
				}

				var dark =
					saved === "dark" ||
					(saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);

				if (dark) document.documentElement.classList.add("dark");
			})();
		</script>

		<link rel="preload" href="/app/assets/fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="__CSS__" />
	</head>
	<body>
		<div id="root"></div>

		<!--
			The site list is written into the page by the server rather than
			fetched. It is the one piece of data every screen needs before it
			can ask a single question, and a round trip for it would put a blank
			frame in front of every load for no benefit.
		-->
		<script id="feasible-bootstrap" type="application/json">
			__BOOTSTRAP__
		</script>

		<script src="__JS__" defer></script>
	</body>
</html>
