#
# ci.yml
# Lint, test and build every pull request.
#
# Created: 2026-08-30
# Copyright (c) 2026 Cloudmanic Labs, LLC. All rights reserved.
#
# The jobs run the same Make targets a developer runs, so a green pipeline means
# the commands in the README work rather than that some parallel CI-only script
# does. Integration tests are not here yet: there is nothing to integrate until
# the ingest pipeline lands.

name: CI

on:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new revision of a pull request supersedes the run it interrupted. Waiting
# on results for code nobody is looking at any more only delays current work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go version comes from go.mod, so CI proves the minimum version we
      # claim to support actually builds rather than whatever is newest.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Make target rebuilds both committed browser bundles before testing.
      # npm ci consumes the lockfiles; setup-node keeps those exact tarballs in
      # npm's download cache without caching a mutable node_modules directory.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tracker/package-lock.json
            web/package-lock.json

      - run: make test

  # The ingest pipeline, the write buffer and the roll-up worker are all
  # concurrent, and a data race there corrupts numbers quietly rather than
  # crashing. It is a separate job because the detector is roughly ten times
  # slower, and holding the fast feedback hostage to it helps nobody.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test-race

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to a 2.x release because .golangci.yml is written in the v2
      # schema, which 1.x cannot read.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: make lint

  # Known vulnerabilities in the toolchain and in dependencies, limited to the
  # ones our code can actually reach. It is its own job so a new advisory fails
  # loudly on the next pull request rather than being noticed at release time.
  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...

  check-env:
    name: Environment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Go toolchain: the check is a grep over the source, and keeping it
      # toolchain-free means it stays fast enough that nobody is tempted to skip it.
      - run: make check-env

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tracker/package-lock.json
            web/package-lock.json

      - run: make build

      # The binary has to actually run. A build that links but cannot start is a
      # failure people otherwise discover after the release is cut.
      - run: ./feasible --version
